name: Build and test

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgis/postgis:17-3.5
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - name: Test, against PostgreSQL with PostGIS
              run: |
                  PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE EXTENSION IF NOT EXISTS postgis'
                  npm test
              env:
                  MIRROR_TEST_DATABASE: postgres://postgres:postgres@localhost:5432/postgres

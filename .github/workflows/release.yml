name: Release Obsidian plugin

# Push a tag equal to manifest.json's version (such as 0.1.0, without a leading v) to draft its release.
on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - name: Build plugin
              run: |
                  npm ci
                  npm run build
            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: main.js
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release create "$tag" --title="$tag" --draft main.js manifest.json
